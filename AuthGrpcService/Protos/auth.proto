syntax = "proto3";

option csharp_namespace = "AuthGrpcService";

package auth;

service Auth {
  rpc Login (Credentials) returns (JwtToken);
  rpc Register (Credentials) returns (JwtToken);
}

message Credentials {
  string login = 1;
  string password = 2;
}

message JwtToken {
  string token = 1;
}
